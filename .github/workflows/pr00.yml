name: PR00 MOCK validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mock-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.6'
      - run: uv sync --locked --python 3.12
      - run: uv run --locked python -m pytest -q -m "not browser"
      - if: runner.os == 'Linux'
        run: uv run --locked python -m playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        env:
          PR00_REQUIRE_BROWSER: "1"
        run: uv run --locked python -m pytest -q -m browser -rs
