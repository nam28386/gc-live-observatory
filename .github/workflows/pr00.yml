name: Observatory synthetic validation

on:
  push:
    branches: [main, feat/phase01-live-ready, feat/phase02-microstructure-engine, feat/phase03-live-capture-reliability, feat/phase04-live-wave-research]
  pull_request:

permissions:
  contents: read

jobs:
  mock-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.6'
      - run: uv sync --locked --python 3.12
      - run: uv run --locked python -m pytest -q -m "not browser"
      - if: runner.os == 'Linux'
        run: uv run --locked python -m playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        env:
          PR00_REQUIRE_BROWSER: "1"
        run: uv run --locked python -m pytest -q -m browser -rs
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($repeat in 1..3) {
            uv run --locked python -m pytest -q tests/test_phase03_recovery.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
